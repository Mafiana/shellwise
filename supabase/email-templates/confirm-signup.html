<div style="background:#0b1220;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#111a30;border:1px solid #223055;border-radius:16px;padding:32px;color:#dbe6ff">
    <p style="margin:0 0 18px;font-size:20px;font-weight:700;color:#ffffff">Shellwise</p>
    <h1 style="margin:0 0 12px;font-size:22px;color:#ffffff">Confirm your email</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#b7c4e3">Welcome! Press the button to confirm your email and start practising.</p>
    <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f8cff;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 24px;border-radius:10px">Confirm my email</a></p>
    <p style="margin:0 0 8px;font-size:14px;color:#b7c4e3">Or enter this code on the sign-up page:</p>
    <p style="margin:0 0 24px;font-size:30px;letter-spacing:6px;font-weight:700;color:#ffffff;font-family:Courier New,monospace">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#7f90b8">The code and link expire soon. If you did not create a Shellwise account, you can ignore this email.</p>
  </div>
</div>
